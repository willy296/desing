<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Mis tareas</title>

  <style>
    :root {
      --primario: #006b8f;
      --enfoque: #004b63;
      --sobre-primario: #ffffff;
      --fondo: #fffbfe;
      --superficie: #f3edf7;
      --texto: #1d1b20;
      --borde: #79747e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    header {
      padding: 28px 20px;
      background: var(--primario);
      color: var(--sobre-primario);
    }

    header div, main {
      width: min(100%, 760px);
      margin: auto;
    }

    h1 { margin: 0; font-size: 2rem; }
    header p { margin-bottom: 0; }
    main { padding: 24px 16px; }

    .tarjeta {
      margin-bottom: 24px;
      padding: 24px;
      border-radius: 24px;
      background: var(--superficie);
      box-shadow: 0 2px 6px #00000018;
    }

    h2 { margin-top: 0; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .controles { display: flex; gap: 12px; }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: var(--fondo);
      color: var(--texto);
      font: inherit;
    }

    button {
      min-height: 48px;
      padding: 12px 24px;
      border: 0;
      border-radius: 28px;
      background: var(--primario);
      color: var(--sobre-primario);
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { filter: brightness(0.9); }

    input:focus-visible, button:focus-visible {
      outline: 3px solid var(--enfoque);
      outline-offset: 3px;
    }

    ul { padding: 0; list-style: none; }

    .tarea {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid var(--borde);
      border-radius: 16px;
    }

    .tarea label {
      flex: 1;
      margin: 0;
      overflow-wrap: anywhere;
      font-weight: normal;
      cursor: pointer;
    }

    .tarea input {
      width: 22px;
      height: 22px;
      accent-color: var(--primario);
    }

    .completada label { text-decoration: line-through; }
    #mensaje { min-height: 24px; margin-bottom: 0; }

    @media (max-width: 500px) {
      .tarjeta { padding: 20px 16px; }
      .controles { flex-direction: column; }

      .tarea {
        gap: 10px;
        padding: 12px;
      }

      .tarea button { padding: 10px 16px; }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>tareas</h1>
      <p>Organiza tus actividades académicas.</p>
    </div>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Nueva tarea</h2>
      <form id="formulario">
        <label for="nombre">Nombre de la tarea</label>
        <div class="controles">
          <input
            type="text"
            id="nombre"
            placeholder="Ejemplo: estudiar JavaScript"
            maxlength="100"
            required>
          <button type="submit">Agregar tarea</button>
        </div>
      </form>
      <p id="mensaje" role="status"></p>
    </section>

    <section class="tarjeta">
      <h2>Lista de tareas</h2>
      <div role="status" aria-live="polite" aria-atomic="true">
        <p id="contador">Pendientes: 0</p>
        <p id="completadas">Completadas: 0</p>
      </div>
      <p id="vacio">Todavía no tienes tareas.</p>
      <ul id="lista"></ul>
      <button type="button" id="eliminar-completadas">Eliminar completadas</button>
    </section>
  </main>

  <script>
    const formulario = document.querySelector("#formulario");
    const nombre = document.querySelector("#nombre");
    const lista = document.querySelector("#lista");
    const contador = document.querySelector("#contador");
    const completadas = document.querySelector("#completadas");
    const mensaje = document.querySelector("#mensaje");
    const vacio = document.querySelector("#vacio");
    const eliminarCompletadas = document.querySelector("#eliminar-completadas");

    let siguienteId = 0;

    function actualizarContador() {
      const pendientes = lista.querySelectorAll(
        'input[type="checkbox"]:not(:checked)'
      ).length;
      const totalCompletadas = lista.querySelectorAll(
        'input[type="checkbox"]:checked'
      ).length;

      contador.textContent = `Pendientes: ${pendientes}`;
      completadas.textContent = `Completadas: ${totalCompletadas}`;
      vacio.hidden = lista.children.length > 0;
    }

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();
      const texto = nombre.value.trim();

      if (texto === "") {
        mensaje.textContent = "Escribe el nombre de la tarea.";
        nombre.focus();
        return;
      }

      const tarea = document.createElement("li");
      tarea.className = "tarea";

      const casilla = document.createElement("input");
      casilla.type = "checkbox";
      casilla.id = `tarea-${++siguienteId}`;

      const etiqueta = document.createElement("label");
      etiqueta.htmlFor = casilla.id;
      etiqueta.textContent = texto;

      const borrar = document.createElement("button");
      borrar.id = `borrar-${siguienteId}`;
      borrar.textContent = "Borrar";
      borrar.type = "button";
      borrar.setAttribute("aria-label", `Eliminar tarea: ${texto}`);

      borrar.addEventListener("click", function() {
        tarea.remove();
        actualizarContador();
        mensaje.textContent = "Tarea eliminada.";
      });

      casilla.addEventListener("change", function() {
        tarea.classList.toggle("completada", casilla.checked);
        actualizarContador();
      });

      tarea.append(casilla, etiqueta, borrar);
      lista.append(tarea);

      formulario.reset();
      actualizarContador();
      mensaje.textContent = "Tarea agregada correctamente.";
      nombre.focus();
    });

    eliminarCompletadas.addEventListener("click", function() {
      const tareasCompletadas = lista.querySelectorAll(
        '.tarea input[type="checkbox"]:checked'
      );

      if (tareasCompletadas.length === 0) {
        mensaje.textContent = "No hay tareas completadas para eliminar.";
        return;
      }

      tareasCompletadas.forEach(function(casilla) {
        casilla.closest(".tarea").remove();
      });
      actualizarContador();
      mensaje.textContent = tareasCompletadas.length === 1
        ? "Se eliminó 1 tarea completada."
        : `Se eliminaron ${tareasCompletadas.length} tareas completadas.`;
    });
  </script>
</body>
</html>
